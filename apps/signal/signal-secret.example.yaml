# Copy this file to signal-secret.yaml, fill in real values, then:
#   kubectl apply -f signal-secret.yaml
#
# signal-secret.yaml is gitignored — never commit it with real values filled in.

apiVersion: v1
kind: Secret
metadata:
  name: signal-secrets
  namespace: signal
type: Opaque
stringData:
  postgres-password: "<pick-a-password>"
  database-url: "postgresql://signal:<same-password>@db:5432/signal"
  gemini-api-key: "<your-gemini-key>"
  anthropic-api-key: ""
